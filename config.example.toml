# musicweb configuration.
# Copy to config.toml (in this folder) or ~/.config/musicweb/config.toml and adjust.
# Everything is optional: anything left out uses the default shown here.
# Environment variables (MPV_AO, PLAYER_NAME, ...) and the command line take precedence over this file.

[server]
host = "0.0.0.0"              # "0.0.0.0" = accept connections from other devices on the network
port = 8080
player_name = "Receiver"      # name of the mpv audio output (phone or server), shown on the page

[interface]
language = "pt-BR"            # interface language: "pt-BR" (Português) or "en" (English)

[library]
music_dir = "~/storage/music"
rescan_every = 60             # seconds between checks for new music (0 disables)
trash_dir = ""                # empty = .musicweb-lixeira folder next to the library

[mpv]
audio_output = ""             # mpv audio output (--ao); empty = "opensles" on Termux, mpv's choice elsewhere
audio_device = ""             # mpv --audio-device; empty = default. On a server, e.g. "alsa/plughw:CARD=PCH,DEV=0"
                              # (the P2 jack); list them with: mpv --audio-device=help
gapless = true                # no pause between tracks (the next one is preloaded)
replaygain = "album"          # volume leveling from ReplayGain tags: "album", "track" or "no"

[player]
resume_on_start = false       # after a restart, play the saved queue right away (false = wait for "play")
lock_minutes = 10             # only the device playing on the Receiver controls it, until it stops or stays paused
                              # this long; 0 = any device controls it at any time

[history]
enabled = true                # record plays for "Histórico" and "Mais tocadas"
min_seconds = 30              # listening time before a track counts as played (half the track if shorter)

[covers]
online = true                 # look up covers on iTunes / MusicBrainz when there is no local cover

[lyrics]
online = true                 # look up lyrics on LRCLIB when there is no .lrc file or lyrics in the tags

[cache]
dir = "~/.cache/musicweb"     # disposable: covers and lyrics

[data]
dir = "~/.local/share/musicweb"   # musicweb.db (SQLite): scan cache, play history and the saved queue
