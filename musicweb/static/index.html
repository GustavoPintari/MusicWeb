<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>MusicWeb</title>
<style>
:root{--bg:#121212;--card:#1c1c1c;--card2:#262626;--fg:#f2f2f2;--mut:#9a9a9a;--ac:#5aa9e6;--err:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* scrolling works as usual (wheel, touch, keyboard); only the scrollbars are hidden */
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,-apple-system,sans-serif;padding:0 16px calc(var(--barh,150px) + 24px)}
button{font:inherit;color:inherit;background:var(--card2);border:0;border-radius:10px;padding:9px 12px;cursor:pointer;
  transition:transform .08s ease,background .15s ease,filter .15s ease;user-select:none}
button:active,.press:active{transform:scale(.92);filter:brightness(1.35)}
/* loading: a spinner in place of the content (buttons keep their size) or over the cover (rows) */
@keyframes spin{to{transform:rotate(360deg)}}
button.busy,label.busy{position:relative;color:transparent!important;pointer-events:none}
button.busy>*,label.busy>*{visibility:hidden}
button.busy::after,label.busy::after,.t.busy:not(:has(.cv)) .n::after,.busy .cv::after,#csr .c.busy::after{
  content:"";position:absolute;left:50%;top:50%;width:1.15em;height:1.15em;margin:-.575em 0 0 -.575em;box-sizing:border-box;
  border:2px solid var(--spin,var(--fg));border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.big,.pa.on{--spin:#0b1620}#pp{--spin:#000}
.t.busy:not(:has(.cv)) .n{position:relative;color:transparent}
.busy .cv::before,#csr .c.busy::before{content:"";position:absolute;inset:0;background:#0009;z-index:2;border-radius:inherit}
.busy .cv::after,#csr .c.busy::after{z-index:3;font-size:18px;color:#fff;--spin:#fff}
#csr .c{position:relative}
svg{width:20px;height:20px;fill:currentColor;display:block}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;display:flex;flex-wrap:wrap;gap:8px}
#q{flex:1 1 180px;min-width:0;padding:10px 12px;border-radius:10px;border:0;background:var(--card);color:var(--fg);font:inherit}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px}
.seg button{background:none;padding:7px 12px;border-radius:8px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--fg)}

/* covers */
.cv{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;display:grid;place-items:center;
  font-weight:700;font-size:28px;color:#fff8;background:var(--ph,#333)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.cv img.ok{opacity:1}

/* album grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 12px;margin-top:6px}
.al{cursor:pointer;min-width:0;transition:transform .08s}
.al:active{transform:scale(.95)}
.al b,.al small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al b{margin-top:6px;font-weight:600}.al small{color:var(--mut);font-size:13px}
.al.on b{color:var(--ac)}

/* artists */
.ar{background:var(--card);border-radius:12px;margin:8px 0;overflow:hidden}
.ar>button{width:100%;text-align:left;background:none;display:flex;align-items:center;gap:12px;padding:12px;border-radius:0}
.ar>button:active{transform:none;background:var(--card2)}
.ar .av{width:44px;height:44px;flex:none;border-radius:50%;font-size:18px;aspect-ratio:auto}
.ar .nm{flex:1;min-width:0}.ar .nm small{display:block;color:var(--mut);font-size:13px}
.ar .chev{transition:transform .2s;color:var(--mut)}.ar.open .chev{transform:rotate(90deg)}
.ar .row{display:none;gap:12px;overflow-x:auto;padding:4px 12px 14px;scroll-snap-type:x mandatory}
.ar.open .row{display:flex}.ar .row .al{flex:0 0 120px;scroll-snap-align:start}

/* open album */
#sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding:0 16px calc(var(--barh,150px) + 24px);
  transform:translateY(100%);transition:transform .25s ease;visibility:hidden}
#sheet.open{transform:none;visibility:visible}
#sheet .top{position:sticky;top:0;background:transparent;margin:0 -16px;padding:12px 16px;z-index:2;transition:background .3s,box-shadow .3s;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
#sheet.scrolled .top{background:var(--bg);box-shadow:0 4px 14px #0006}
/* album page background, two styles the viewer switches between (remembered on the device):
   "glass": the cover itself, enlarged and blurred, with the header on a frosted glass panel;
   "vinyl": a dark background in the cover's color with grooves coming out from behind the cover, like a record */
#sbg{position:absolute;left:0;right:0;top:0;height:600px;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .45s}
#sbg i{position:absolute;inset:0}
#sbg::after{content:"";position:absolute;inset:0}
#sheet.tinted #sbg{opacity:1}
#sheet[data-bg="glass"] #sbg i{background:var(--cvurl,none) center/cover var(--tint);transform:scale(1.4);filter:blur(50px) saturate(1.6) brightness(.85)}
#sheet[data-bg="glass"] #sbg::after{background:linear-gradient(180deg,transparent 35%,var(--bg) 92%)}
#sheet.tinted[data-bg="glass"] .hero{padding:16px;border-radius:16px;background:#12121280;border:1px solid #ffffff1a;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#sheet.tinted.scrolled[data-bg="glass"] .top{background:#12121299;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#sheet[data-bg="vinyl"] #sbg i{
  background:repeating-radial-gradient(circle at var(--gx,126px) var(--gy,172px),transparent 0 5px,color-mix(in srgb,var(--groove) 22%,transparent) 5px 6px),
    radial-gradient(circle at var(--gx,126px) var(--gy,172px),color-mix(in srgb,var(--groove) 35%,transparent),transparent 70%),var(--vbg);
  -webkit-mask-image:linear-gradient(180deg,#000 45%,transparent 95%);mask-image:linear-gradient(180deg,#000 45%,transparent 95%)}
#sheet.tinted.scrolled[data-bg="vinyl"] .top{background:var(--vbg)}
.bgsw{display:none;background:#0006;border-radius:10px;padding:3px}
#sheet.isalbum .bgsw{display:flex}
.bgsw button{background:none;padding:6px 11px;border-radius:8px;color:var(--mut);font-size:13px}
.bgsw button.on{background:#ffffff1f;color:var(--fg)}
#sheet>*{position:relative;z-index:1}#sheet>.top{z-index:2}#sheet>#sbg{position:absolute;z-index:0}
.hero{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.hero .cv{width:min(220px,100%);font-size:56px;box-shadow:0 8px 30px #0008}
.hero .inf{flex:1 1 200px;min-width:0}
.hero h1{margin:0 0 4px;font-size:22px}.hero .full{color:var(--mut);font-size:13px;margin-bottom:4px}
.hero .meta{color:var(--mut);font-size:14px;margin-bottom:12px}
.big{background:var(--ac);color:#0b1620;font-weight:700;padding:11px 20px;border-radius:24px;display:inline-flex;gap:8px;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ed label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
.ed input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:var(--card);color:var(--fg);font:inherit}
.ed input:focus{outline:none;border-color:var(--ac)}
.ed .two{display:grid;grid-template-columns:1fr 90px;gap:10px}
.et{display:grid;grid-template-columns:52px 1fr;gap:6px 8px;padding:10px 0;border-top:1px solid #2a2a2a}
.et input.num{text-align:center}.et input.ar{grid-column:2;font-size:13px;padding:7px 10px}
.ed .note{color:var(--mut);font-size:12px;margin:14px 0}
.ed .errs{color:var(--err);font-size:13px;white-space:pre-line}
.cvacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cvacts button,.cvacts label{font-size:14px}
.ed label.btn{display:inline-block;margin:0;color:var(--fg);font-size:14px}
label.btn{background:var(--card2);border-radius:10px;padding:9px 12px;cursor:pointer;transition:transform .08s,filter .15s}
label.btn:active{transform:scale(.92);filter:brightness(1.35)}
#cs{display:none;background:var(--card);border-radius:12px;padding:12px;margin:12px 0}
#cs.open{display:block}
#cs form{display:flex;gap:8px}#cs form input{flex:1;min-width:0}
#csr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:12px}
#csr .c{cursor:pointer;min-width:0;transition:transform .08s}#csr .c:active{transform:scale(.94)}
#csr img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;background:#333}
#csr small{display:block;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.danger{border-top:1px solid #3a2222;margin-top:26px;padding-top:16px}
.danger>button{color:var(--err)}
#delbox{display:none;background:#2a1717;border-radius:12px;padding:14px;margin-top:10px}
#delbox.open{display:block}
#delbox p{margin:0 0 10px}
#delbox label{display:flex;gap:8px;align-items:center;color:var(--fg);font-size:14px;margin:0 0 12px}
#delbox input{width:auto}
.redbtn{background:var(--err);color:#200;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(var(--barh,150px) + 20px);transform:translate(-50%,20px);opacity:0;background:#333;color:var(--fg);
  padding:10px 16px;border-radius:10px;z-index:30;transition:.25s;pointer-events:none;max-width:90vw;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#outrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
#out{font-size:12px;padding:5px 10px;border-radius:14px;background:var(--card);color:var(--mut);display:inline-flex;gap:6px;align-items:center}
#out.local{color:var(--ac);background:color-mix(in srgb,var(--ac) 20%,#121212)}
.fb{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:4px;background:var(--card2);color:var(--mut);white-space:nowrap}
.fb.hq{color:var(--ac);background:color-mix(in srgb,var(--ac) 20%,#121212)}
.cv .fb{position:absolute;top:6px;right:6px;z-index:1;background:#000a;color:#fff}
.cv .fb.hq{background:#0d2238dd;color:#9cd0ff}
a.btn2{background:var(--card2);color:var(--fg);border-radius:10px;padding:9px 12px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  transition:transform .08s,filter .15s}
a.btn2:active{transform:scale(.92);filter:brightness(1.35)}
.t .fb{margin-left:4px}
.t{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:8px;cursor:pointer}
.t:active{background:var(--card2)}
.t .n{width:22px;text-align:right;color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.t .ti{flex:1;min-width:0}.t .ti small{display:block;color:var(--mut);font-size:13px}
.t .d{color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px}
.t.on .ti{color:var(--ac)}
.disc{color:var(--mut);font-size:13px;margin:14px 8px 4px}
.eq{display:inline-flex;gap:2px;height:14px;align-items:flex-end;width:22px;justify-content:flex-end}
.eq i{width:3px;background:var(--ac);animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.eq.paused i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

/* player */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0a0a0aee;backdrop-filter:blur(12px);transition:background .6s;
  border-top:1px solid #222;padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
#pg{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
#pg span{min-width:34px}#pg span:last-child{text-align:right}
#prog{position:relative;flex:1;height:20px;cursor:pointer;display:flex;align-items:center;touch-action:none}
#prog .tr{height:4px;width:100%;background:#333;border-radius:2px;overflow:hidden;transition:height .15s}
#prog:hover .tr{height:6px}
#prog .fl{height:100%;width:0;background:var(--ac)}
.pl{display:flex;align-items:center;gap:10px}
#now{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
#now .cv{width:46px;flex:none;font-size:16px;border-radius:6px}
#now .tx{min-width:0}
#now .tx b,#now .tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now .tx small{color:var(--mut);font-size:13px}
.ctl{display:flex;gap:6px}
.ctl button{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:50%}
#pp{background:var(--fg);color:#000;width:48px;height:48px}
#err{color:var(--err);font-size:12px;margin-top:4px}
#bar.tinted{background:linear-gradient(105deg,color-mix(in srgb,var(--btint) 75%,#000c) 15%,color-mix(in srgb,var(--btint3) 75%,#000c) 55%,color-mix(in srgb,var(--btint2) 75%,#000c));border-top-color:#fff1}
#bar.tinted #prog .tr{background:#fff3}
#volpop{display:none;align-items:center;gap:10px;padding:8px 0 4px}
#volpop.open{display:flex}
#volpop input{flex:1;accent-color:var(--ac);height:28px}
#volpop span{min-width:40px;text-align:right;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
#vol.on{color:var(--ac)}
.empty{color:var(--mut);text-align:center;margin-top:40px}

/* lyrics */
.orr{display:flex;align-items:center;gap:8px}
#lyb{font-size:12px;padding:5px 10px;border-radius:14px;background:var(--card);color:var(--mut)}
#lyb.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 20%,#121212)}
.lyh{display:flex;gap:12px;align-items:center;margin:4px 0 18px}
.lyh .cv{width:64px;flex:none;font-size:22px;border-radius:6px}
.lyh div:last-child{min-width:0}.lyh b,.lyh small{display:block;overflow:hidden;text-overflow:ellipsis}
.lyh small{color:var(--mut);font-size:14px}
.ly p{margin:0;padding:6px 4px;font-size:22px;font-weight:700;line-height:1.3;color:#5c5c5c;cursor:pointer;border-radius:8px;
  transition:color .25s}
.ly p.past{color:#8a8a8a}.ly p.on{color:var(--fg)}
.ly p:active{background:var(--card)}
.ly.plain{white-space:pre-line;font-size:18px;font-weight:500;line-height:1.55;color:var(--fg)}
.lysrc{color:var(--mut);font-size:12px;margin-top:24px}.lysrc a{color:var(--ac)}

/* YouTube */
#ytsh h1{font-size:22px;margin:4px 0 6px}
#ytsh .note{color:var(--mut);font-size:13px;margin:0 0 14px}
#ytf{display:flex;gap:8px;flex-wrap:wrap}
#ytu{flex:1 1 220px;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid #333;background:var(--card);color:var(--fg);font:inherit}
#ytu:focus{outline:none;border-color:var(--ac)}
#yterr{color:var(--err);font-size:13px;margin-top:8px}
.t .yth{width:68px;aspect-ratio:16/9;flex:none;font-size:16px;border-radius:5px}
.t .x{background:none;color:var(--mut);padding:6px 8px;flex:none}

/* played: most played and history */
.per{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 4px}
.per button{padding:6px 12px;border-radius:16px;background:var(--card);color:var(--mut);font-size:13px}
.per button.on{background:var(--card2);color:var(--fg)}
.per span{color:var(--mut);font-size:12px;margin-left:auto}
.sec{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 6px}
.hr{display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px;cursor:pointer}
.hr:active{background:var(--card2)}
.hr .n{width:22px;text-align:right;color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.hr .cv{width:44px;flex:none;font-size:16px;border-radius:5px}
.hr .ti{flex:1;min-width:0}.hr .ti b,.hr .ti small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .ti b{font-weight:500}.hr .ti small{color:var(--mut);font-size:13px}
.hr .d{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hr.gone{opacity:.45}.hr.on .ti b{color:var(--ac)}
.pas{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px}
.pa{padding:7px 12px;border-radius:16px;background:var(--card);font-size:14px}.pa small{color:var(--mut);margin-left:6px}

/* radio */
#rdsh h1,#rtsh h1{font-size:22px;margin:4px 0 12px}
#rdf{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#rdf input,#rdf select,#rtsel{flex:1 1 160px;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid #333;background:var(--card);color:var(--fg);font:inherit}
#rdtags{margin-bottom:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
#rdtags .pa{flex:none}.pa.on{background:var(--ac);color:#0b1620}
.rr .cv{border-radius:8px;background:var(--card2)}.rr .cv img{object-fit:contain;background:#fff1}
.star{background:none;color:var(--mut);font-size:20px;padding:4px 8px;flex:none}.star.on{color:#f5c518}
#rderr{color:var(--err);font-size:13px;margin:6px 0}
.live{font-size:10px;font-weight:700;letter-spacing:.06em;color:#ff6b6b}

/* retrospective */
.rt-hero{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--card);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tile small{color:var(--mut);font-size:12px}
.rt-cmp{color:var(--mut);font-size:13px;margin:-4px 0 6px}
.rt-top{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:14px;padding:14px;margin:8px 0}
.rt-top .cv{width:96px;flex:none;font-size:34px}.rt-top small{color:var(--mut);display:block}.rt-top b{font-size:19px;display:block;margin:2px 0}
.rt-albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.rt-albums small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-albums b{display:block;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{background:var(--card);border-radius:12px;padding:12px 12px 8px;margin:8px 0}
.chart p{margin:0 0 10px;font-size:14px}.chart p small{color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid #3a3a3a;position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;cursor:default}
.bars .b i{display:block;width:100%;max-width:22px;background:var(--ac);border-radius:4px 4px 0 0;min-height:0;opacity:.85}
.bars .b:hover i,.bars .b.pk i{opacity:1}
.bars .b span{font-size:11px;color:var(--fg);margin-bottom:3px;font-variant-numeric:tabular-nums}
.axis{display:flex;gap:2px;margin-top:4px}.axis span{flex:1;text-align:center;font-size:10px;color:var(--mut);min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){#st{display:none}}
</style></head><body>

<header>
  <input id="q" placeholder="Buscar álbum, artista ou faixa…" autocomplete="off">
  <div class="seg"><button data-v="albums" data-t>Álbuns</button><button data-v="artists" data-t>Artistas</button><button data-v="plays" data-t>Tocadas</button></div>

// ---------- album colors from the cover: up to three strong hues (for a gradient of color "patches"),
// darkened to sit behind white text, plus a light accent of the same hue for the buttons.
// Hues are grouped in 24 bins weighted by saturation, so a few vivid colors win over a large white or gray area,
// and the colors aren't averaged together (averaging many hues is what made "muddy brown").
const tintCache={};
function toHsl(r,g,b){
  r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,dl=mx-mn;
  let h=0;if(dl)h=(mx===r?((g-b)/dl+6)%6:mx===g?(b-r)/dl+2:(r-g)/dl+4)*60;
  return [h,dl?dl/(1-Math.abs(2*l-1)):0,l];
}
function coverColors(d){                    // d: RGBA pixels of the cover, scaled down
  const bins=Array.from({length:24},()=>({w:0,r:0,g:0,b:0}));let n=0,cn=0;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<128)continue;n++;
    const [h,s,l]=toHsl(d[i],d[i+1],d[i+2]);
    if(s<.2||l<.12||l>.9)continue;          // grays, near black/white
    cn++;
    const wt=s*s*Math.max(.05,1-Math.abs(l-.5)*1.6),bn=bins[Math.floor(h/15)%24];   // favor vivid mid tones
    bn.w+=wt;bn.r+=d[i]*wt;bn.g+=d[i+1]*wt;bn.b+=d[i+2]*wt;
  }
  if(!n||cn<n*.03)return null;              // black and white cover
  const at=i=>bins[(i+24)%24],score=i=>at(i-1).w*.5+at(i).w+at(i+1).w*.5;
  const hueOf=k=>{let w=0,r=0,g=0,b=0;for(const bn of [at(k-1),at(k),at(k+1)]){w+=bn.w;r+=bn.r;g+=bn.g;b+=bn.b}return toHsl(r/w,g/w,b/w)};
  // strongest hue first; each next one at least 45° from the others and with 8% of the first one's weight
  const far=(i,ks)=>ks.every(k=>Math.min(Math.abs(i-k),24-Math.abs(i-k))>=3),ks=[];
  while(ks.length<3){
    let b=-1;for(let i=0;i<24;i++)if(far(i,ks)&&(b<0||score(i)>score(b)))b=i;
    if(b<0||score(b)<=0||(ks.length&&score(b)<score(ks[0])*.08))break;
    ks.push(b);
  }
  const cl=(v,a,z)=>Math.min(z,Math.max(a,v));
  const dark=([h,s])=>`hsl(${Math.round(h)} ${Math.round(cl(s*1.1,.45,.8)*100)}% ${h>=40&&h<=75?24:28}%)`;   // yellows look brighter
  const cs=ks.map(k=>dark(hueOf(k))),[h,s]=hueOf(ks[0]);
  return {bg:cs[0],bg2:cs[1]||cs[0],bg3:cs[2]||cs[1]||cs[0],
    vbg:`hsl(${Math.round(h)} ${Math.round(cl(s,.35,.6)*100)}% 20%)`,groove:`hsl(${Math.round(h)} ${Math.round(cl(s*1.2,.5,.85)*100)}% 55%)`,
    ac:`hsl(${Math.round(h)} ${Math.round(cl(s,.6,.9)*100)}% ${h>=200&&h<=280?72:64}%)`};
}
function albumTint(a){
  if(tintCache[a.id])return Promise.resolve(tintCache[a.id]);
  const ph=`hsl(${hue((a.name||"")+(a.artist||""))} 35% 26%)`,gray={bg:"hsl(0 0% 17%)",bg2:"hsl(0 0% 17%)",bg3:"hsl(0 0% 17%)",vbg:"#1b1b1d",groove:"#8a8a8a",ac:""};
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const c=document.createElement("canvas");c.width=c.height=48;
        const x=c.getContext("2d");x.drawImage(img,0,0,48,48);
        res(tintCache[a.id]=coverColors(x.getImageData(0,0,48,48).data)||gray);
      }catch(e){res(tintCache[a.id]={bg:ph,bg2:ph,bg3:ph,vbg:ph,groove:"#8a8a8a",ac:""})}
    };
    img.onerror=()=>res(tintCache[a.id]={bg:ph,bg2:ph,bg3:ph,vbg:ph,groove:"#8a8a8a",ac:""});   // same hue as the placeholder cover
    img.src=`/api/cover/${a.id}?v=${a.cv||0}`;
  });
}
function paint(el,c,pre){                   // c.ac is empty for gray covers: keep the default accent
  el.style.setProperty(`--${pre}`,c.bg);el.style.setProperty(`--${pre}2`,c.bg2);el.style.setProperty(`--${pre}3`,c.bg3);
  if(c.ac)el.style.setProperty("--ac",c.ac);else el.style.removeProperty("--ac");
}
// key: which sheet asked, so a late answer can't tint another one. The player bar takes the same colors,
// so the album page looks like one piece; everywhere else both stay neutral.
function setTint(key,a){
  const sh=$("#sheet"),bar=$("#bar"),meta=document.querySelector('meta[name="theme-color"]');
  sh.classList.toggle("isalbum",!!a);
  if(!a){for(const el of [sh,bar]){el.classList.remove("tinted");el.style.removeProperty("--ac")}meta.content="#121212";return}
  albumTint(a).then(c=>{
    if(openAlbum!==key)return;
    paint(sh,c,"tint");paint(bar,c,"btint");
    sh.style.setProperty("--vbg",c.vbg);sh.style.setProperty("--groove",c.groove);
    sh.style.setProperty("--cvurl",`url("/api/cover/${a.id}?v=${a.cv||0}")`);
    sh.classList.add("tinted");bar.classList.add("tinted");meta.content=albumBg==="vinyl"?c.vbg:c.bg;
  });
}

function grooveCenter(){                    // the vinyl grooves come out from the middle of the album cover
  const sh=$("#sheet"),cv=sh.querySelector(".hero .cv");if(!cv)return;

}

  const af=albumFmt(a),tot=a.tracks.reduce((s,t)=>s+(t.dur||0),0),discs=new Set(a.tracks.map(t=>t.disc)).size>1;let lastDisc=null;
  $("#sheetBody").innerHTML=`<div class="hero">${cover(a,"",true)}<div class="inf">
      <h1>${esc(a.name)}</h1>

// ---------- YouTube: each video becomes a single "track" in an "album" with the same id
let ytList=[];const ytKnown={};
function regYT(y){
  const t={id:y.id,title:y.title,artist:y.artist,dur:y.dur,fmt:y.fmt,q:y.q,n:0,disc:1};
  const a={id:y.id,name:y.title,full:y.title,artist:y.artist,year:"",cv:0,yt:true,tracks:[t]};
  trackById[y.id]={t,a};return a;
}
function regPL(pl){                         // playlist videos share one tracks list, so the queue is the whole playlist
  const ts=pl.entries.map((e,i)=>({id:e.id,title:e.title,artist:e.artist,dur:e.dur,fmt:e.fmt,q:e.q,n:i+1,disc:1}));
  pl.entries.forEach((e,i)=>trackById[e.id]={t:ts[i],a:{id:e.id,name:e.title,full:e.title,artist:e.artist,year:"",cv:0,yt:true,pl:pl.id,tracks:ts}});
  return ts.map(t=>t.id);
}
async function playPlaylist(pl,pos=0){
  if(!pl.entries){
    const r=await fetch("/api/yt_playlist?id="+encodeURIComponent(pl.id));
    if(!r.ok)throw new Error(T("Não consegui abrir essa playlist"));
    pl=await r.json();
  }
  const ids=regPL(pl);
  return ctl.playQueue(ids,pos,pl.id);
}
function renderYT(){
  if(!$("#ytsh"))$("#sheetBody").innerHTML=`<div id="ytsh"><h1>YouTube</h1>
    <p class="note">${T("Cole o link de um vídeo ou de uma playlist para tocar só o áudio.")}</p>
    <form id="ytf"><input id="ytu" type="url" inputmode="url" placeholder="https://youtu.be/…" autocomplete="off" enterkeyhint="go">
      <button class="big" id="ytgo">${PLAY} ${T("Tocar")}</button></form><div id="yterr"></div><div id="ytr"></div></div>`;
  $("#ytr").innerHTML=ytList.length?`<div class="disc">${T("Tocados recentemente")}</div>`+ytList.map(a=>{
    if(a.playlist)return `<div class="t" data-pl="${a.id}"><span class="n"></span>${cover({id:a.id,name:a.title,artist:a.artist},"yth")}<span class="ti">${esc(a.title)}<small>${T("Playlist · {n} vídeos",{n:a.count})}${a.artist?" · "+esc(a.artist):""}</small></span><button class="x" data-x="${a.id}" title="${T("Tirar do histórico")}">✕</button></div>`;
    const t=a.tracks[0];
    return `<div class="t" data-t="${t.id}"><span class="n"></span>${cover(a,"yth")}<span class="ti">${esc(t.title)}<small>${esc(t.artist)}</small></span><span class="d">${t.dur?fmt(t.dur):""}</span><button class="x" data-x="${t.id}" title="${T("Tirar do histórico")}">✕</button></div>`}).join(""):"";
  markPlaying();
}
async function addYT(url){                 // registers a video or a playlist (asks the server/yt-dlp)
  let r;try{r=await (await fetch("/api/yt",{method:"POST",body:JSON.stringify({url})})).json()}
  catch(e){throw new Error(T("Sem conexão com o servidor"))}
  if(!r.ok)throw new Error(r.error||T("Não consegui abrir esse vídeo"));
  if(r.playlist){
    const pl=r.playlist;regPL(pl);
    ytList=[{playlist:true,id:pl.id,title:pl.title,artist:pl.artist,count:pl.count},...ytList.filter(x=>x.id!==pl.id)];
    return r;
  }
  ytKnown[r.item.id]=r.item;const a=regYT(r.item);ytList=[a,...ytList.filter(x=>x.id!==a.id)];
  return r;
}
async function playYT(){
  const u=$("#ytu").value.trim(),b=$("#ytgo");if(!u)return;
  b.classList.add("busy");b.disabled=true;$("#yterr").textContent="";navigator.vibrate?.(10);
  try{
    const r=await addYT(u);
    $("#ytu").value="";renderYT();
    if(r.playlist)await playPlaylist(r.playlist,r.start);
    else await ctl.playTrack(r.item.id);
  }catch(e){$("#yterr").textContent=e.message}
  finally{b.classList.remove("busy");b.disabled=false}
}
async function removeYT(id){
  ytList=ytList.filter(a=>a.id!==id);renderYT();
  try{await fetch("/api/yt_remove",{method:"POST",body:JSON.stringify({id})})}catch(e){}
}

function relTime(at){
  const d=new Date(at*1000),now=new Date(),s=(now-d)/1000,hm=d.toLocaleTimeString(LOC,{hour:"2-digit",minute:"2-digit"});
  if(s<60)return T("agora");
  if(s<3600)return T("há {n} min",{n:Math.floor(s/60)});
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(),dd=(day(now)-day(d))/86400000;
  if(dd===0)return T("hoje {hm}",{hm});
  if(dd===1)return T("ontem {hm}",{hm});
  return `${d.toLocaleDateString(LOC,{day:"2-digit",month:"2-digit"})} ${hm}`;
}

let LY={tid:null},lyUserScroll=0,lySeq=0;
function parseLRC(s){
  const out=[];
  for(const line of s.split(/\r?\n/)){
    const tags=[...line.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];if(!tags.length)continue;
    const text=line.replace(/\[[^\]]*\]/g,"").trim();
    for(const m of tags)out.push({t:+m[1]*60+parseFloat(m[2].replace(":",".")),text});
  }
  return out.sort((a,b)=>a.t-b.t);
}
const lyForm=(ar,ti)=>`<form id="lyf" class="ed"><label>${T("Artista")}</label><input id="lya" value="${esc(ar)}">
  <label>${T("Nome da música")}</label><input id="lyt" value="${esc(ti)}"><div class="acts" style="margin-top:12px"><button class="big">${T("Buscar letra")}</button></div></form>`;
function renderLyrics(force){
  const tr=S.track;
  if(!tr){LY={tid:null};$("#sheetBody").innerHTML=`<p class="empty">${T("Nada tocando.")}</p>`;return}
  const key=tr.radio?tr.id+"|"+(tr.live||""):tr.id;          // radio: new lyrics when the song on air changes
  if(!force&&LY.key===key&&$("#lyv"))return;
  LY={tid:tr.id,key,lines:null,idx:-1};
  const a=byId[tr.album]||trackById[tr.id]?.a||{id:tr.album,name:tr.album_name,artist:""};
  $("#sheetBody").innerHTML=`<div id="lyv"><div class="lyh">${cover(a,"",true)}<div><b>${esc(tr.title)}</b><small>${esc(tr.artist||tr.album_artist)}</small></div></div>
    <div id="lyc"><p class="empty">${T("Buscando letra…")}</p></div></div>`;
  if(tr.radio){                              // stations send "Artist - Song" (ICY metadata), when they send anything
    const m=(tr.live||"").split(/\s+-\s+/);
    if(m.length<2){$("#lyc").innerHTML=`<p class="empty">${T("Esta rádio não informa a música que está tocando.")}</p>`;return}
    return fetchLyrics(tr.id,m[0].trim(),m.slice(1).join(" - ").trim());
  }
  fetchLyrics(tr.id);
}
async function fetchLyrics(tid,artist,title,retry=1){
  const p=new URLSearchParams({id:tid});if(artist!=null){p.set("artist",artist);p.set("title",title)}
  const seq=++lySeq;
  let r;try{r=await (await fetch("/api/lyrics?"+p)).json()}catch(e){r={ok:false,error:T("Sem conexão com o servidor")}}
  if(seq!==lySeq||LY.tid!==tid||openAlbum!=="@ly")return;
  if(!r.ok&&r.error&&retry){                 // LRCLIB slow or busy: try again by itself before showing the error
    await new Promise(ok=>setTimeout(ok,1500));
    if(seq===lySeq&&LY.tid===tid&&openAlbum==="@ly")fetchLyrics(tid,artist,title,retry-1);
    return;
  }
  LY.lines=null;LY.idx=-1;
  const form=lyForm(r.artist??S.track?.artist??"",r.title??S.track?.title??"");
  let h;
  if(r.ok&&r.synced){LY.lines=parseLRC(r.synced);h=`<div class="ly">${LY.lines.map((l,i)=>`<p data-i="${i}">${esc(l.text)||"♪"}</p>`).join("")}</div>`}
  else if(r.ok&&r.plain)h=`<div class="ly plain">${esc(r.plain)}</div>`;
  else if(r.ok&&r.instrumental)h=`<p class="empty">♪ Instrumental</p>`;
  else h=`<p class="empty">${esc(r.error||T("Não encontrei a letra desta música."))}</p><p class="empty" style="margin-top:6px">${T("Confira o nome e tente de novo:")}</p>`;
  h+=r.ok?`<p class="lysrc">${T("Letra")}: ${esc(r.src)}${r.synced?" · "+T("sincronizada (toque numa linha para pular até ela)"):""} · <a href="#" id="lyre">${T("Letra errada? Buscar outra")}</a></p><div id="lyfw" hidden>${form}</div>`:form;
  $("#lyc").innerHTML=h;tick();
}
function lyTick(t){
  if(openAlbum!=="@ly"||!LY.lines||S.track?.id!==LY.tid)return;
  let i=-1;for(let k=0;k<LY.lines.length;k++){if(LY.lines[k].t<=t+.25)i=k;else break}
  if(i===LY.idx)return;LY.idx=i;
  document.querySelectorAll(".ly p").forEach((p,k)=>{p.classList.toggle("on",k===i);p.classList.toggle("past",k<i)});
  if(i>=0&&performance.now()-lyUserScroll>4000)document.querySelector(`.ly p[data-i="${i}"]`)?.scrollIntoView({behavior:"smooth",block:"center"});
}

function shrinkImage(file,max=1200){       // shrink large photos before uploading
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error(T("falha ao converter"))),"image/jpeg",.9)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(T("não consegui abrir a imagem")))};
    img.src=url;
  });
}

let mode="remote",playerName="Receiver",trackById={};
try{mode=localStorage.getItem("out")==="local"?"local":"remote"}catch(e){}
const au=new Audio();au.preload="auto";
const L={queue:[],pos:-1,err:""};
try{const v=localStorage.getItem("lvol");if(v!=null)au.volume=Math.min(1,Math.max(0,+v))}catch(e){}

function localStatus(){

  return {state:st,time:au.currentTime||0,dur:isFinite(au.duration)&&au.duration?au.duration:(ti?ti.t.dur:0),

      fmt:ti.t.fmt,q:ti.t.q,radio:!!ti.t.radio,live:""}};

// HLS streams (.m3u8, used by some radios): Safari and Android play them natively; other browsers use hls.js,
// loaded only the first time one is needed
let hlsLib=null,hlsPlayer=null;
const isHls=t=>t?.radio&&(t.hls||/\.m3u8(\?|$)/i.test(t.url||""));
function loadHls(){
  return hlsLib??=new Promise((ok,fail)=>{const sc=document.createElement("script");
    sc.src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js";sc.onload=()=>ok(window.Hls);sc.onerror=()=>{hlsLib=null;fail(new Error("hls.js"))};
    document.head.append(sc)});
}
function hlsStop(){if(hlsPlayer){hlsPlayer.destroy();hlsPlayer=null}}

let LC={tid:null};                          // listening counter for the current local track
function localPlay(queue,pos,t=0,autoplay=true){
  if(pos<0||pos>=queue.length){localStop();return}
  if(L.queue!==queue)L.fails=0;
  L.queue=queue;L.pos=pos;L.err="";LC={tid:queue[pos],heard:0,last:null,counted:false};
  hlsStop();
  const tr=trackById[queue[pos]]?.t,url=tr?.url||"/api/stream/"+queue[pos];       // radio: the stream itself
  const fail=e=>{
    if(e.name==="AbortError")return;         // another track was loaded meanwhile: not an error
    if(e.name!=="NotAllowedError"&&au.error)return;   // load failed: the "error" handler explains it
    L.err=e.name==="NotAllowedError"?T("Toque em ▶ para começar a tocar aqui"):T("Não consegui tocar: ")+e.message;lshow()};
  if(isHls(tr)&&!au.canPlayType("application/vnd.apple.mpegurl")){
    au.removeAttribute("src");
    loadHls().then(Hls=>{
      if(L.queue!==queue||L.pos!==pos)return;
      if(!Hls.isSupported())throw new Error(T("Este navegador não conseguiu tocar {what}",{what:"HLS"}));
      hlsPlayer=new Hls();hlsPlayer.loadSource(url);hlsPlayer.attachMedia(au);
      hlsPlayer.on(Hls.Events.ERROR,(ev,d)=>{if(d.fatal){L.err=T("Não consegui tocar: ")+(d.details||d.type);hlsStop();lshow()}});
      if(autoplay)au.play().catch(fail);
    }).catch(fail);
    lshow();return;
  }
  au.src=url;
  if(t>1)au.addEventListener("loadedmetadata",()=>{au.currentTime=t},{once:true});
  if(autoplay)au.play().catch(fail);
  lshow();
}
function localStop(){hlsStop();au.pause();au.removeAttribute("src");au.load();L.pos=-1;lshow()}
au.addEventListener("ended",()=>localPlay(L.queue,L.pos+1));
au.addEventListener("error",async()=>{
  if(!au.getAttribute("src")||hlsPlayer)return;
  const q=L.queue,p=L.pos,tid=q[p],ti=trackById[tid];
  L.err=T("Este navegador não conseguiu tocar {what}",{what:(ti?.t.fmt||T("o arquivo"))+(ti?` (${ti.t.title})`:"")});
  if(tid?.startsWith("yt_")){                // YouTube: the server knows why (yt-dlp error, "not a bot"...)
    try{const r=await (await fetch("/api/yt_check?id="+encodeURIComponent(tid))).json();if(!r.ok&&r.error)L.err="YouTube: "+r.error}catch(e){}
    if(L.queue!==q||L.pos!==p)return;
  }
  lshow();
  L.fails=(L.fails||0)+1;
  if(L.fails>=3)return;                      // don't run through a whole playlist when every track fails
  setTimeout(()=>{if(L.err&&L.queue===q&&L.pos===p)localPlay(q,p+1)},2500);
});
au.addEventListener("playing",()=>{L.fails=0});
["play","pause","loadedmetadata"].forEach(ev=>au.addEventListener(ev,lshow));
au.addEventListener("timeupdate",()=>{
  if(mode!=="local"||!historyOn||!LC.tid||LC.counted||trackById[LC.tid]?.t.radio)return;   // radio is not counted
  const t=au.currentTime;
  if(LC.last!=null){const dt=t-LC.last;if(dt>0&&dt<2)LC.heard+=dt}   // jumps (seeking) don't count
  LC.last=t;
  const dur=trackById[LC.tid]?.t.dur||(isFinite(au.duration)?au.duration:0),need=dur&&dur<2*playMin?Math.max(1,dur/2):playMin;
  if(LC.heard>=need){
    LC.counted=true;
    fetch("/api/played",{method:"POST",body:JSON.stringify({id:LC.tid})}).then(()=>{if(view==="plays"){P.data=null;renderPlays()}}).catch(()=>{});
  }
});

function mediaMeta(){

    const p=S.state==="playing";S.state=p?"paused":"playing";S.time=(S.time||0)+(p?(performance.now()-recvAt)/1000:0);recvAt=performance.now();
    btn.innerHTML=p?PLAY:PAUSE;api(p?"pause":"resume",null,btn)},
  next(btn){if(mode==="local"){navigator.vibrate?.(10);localPlay(L.queue,L.pos+1)}else api("next",null,btn)},
  prev(btn){if(mode==="local"){navigator.vibrate?.(10);if(au.currentTime>5){au.currentTime=0;lshow()}else localPlay(L.queue,Math.max(0,L.pos-1))}
    else api("prev",null,btn)},
  stop(btn){if(mode==="local"){navigator.vibrate?.(10);localStop()}else api("stop",null,btn)},
  seek(t){if(mode==="local"){au.currentTime=t;lshow()}else{S.time=t;recvAt=performance.now();tick();api("seek",{t})}},
  volume(v){v=Math.max(0,Math.min(100,v));
    if(mode==="local"){au.volume=v/100;try{localStorage.setItem("lvol",au.volume)}catch(e){};lshow();return Promise.resolve()}
    return api("volume",{v})},
  volDelta(d,btn){if(mode==="local"){navigator.vibrate?.(10);return ctl.volume(Math.round(au.volume*100)+d)}return api("volume",{delta:d},btn)},
};

function renderOut(){
  const o=$("#out");o.classList.toggle("local",mode==="local");
  o.innerHTML=mode==="local"?T("Este dispositivo"):esc(playerName);
  o.title=T("Trocar onde a música toca");
}

// switch output, carrying over the track and position
async function switchOutput(){
  navigator.vibrate?.(10);$("#out").classList.add("busy");
  try{
    if(mode==="remote"){
      let st=null;try{st=await (await fetch("/api/status")).json()}catch(e){}
      mode="local";try{localStorage.setItem("out",mode)}catch(e){}
      const ti=st?.track&&st.state!=="stopped"&&trackById[st.track.id];
      if(ti){
        const q=ti.a.tracks.map(t=>t.id),playing=st.state==="playing";
        fetch("/api/pause",{method:"POST"});
        localPlay(q,q.indexOf(ti.t.id),st.time||0,playing);
      }else show(localStatus());
      toast(T("Tocando neste dispositivo"));
    }else{
      const ti=L.pos>=0&&trackById[L.queue[L.pos]],playing=!au.paused,t=au.currentTime||0;
      au.pause();mode="remote";try{localStorage.setItem("out",mode)}catch(e){}
      S={state:"stopped"};
      if(ti&&(playing||t>0)){await api("play",{id:ti.t.id,t});if(!playing)await api("pause")}
      else await poll();
      toast(T("Tocando no {name}",{name:playerName}));
    }
  }finally{$("#out").classList.remove("busy");renderOut()}
}
$("#out").onclick=switchOutput;

$("#back").onclick=()=>history.back();
$("#bgsw").onclick=e=>{const b=e.target.closest("button");if(b){navigator.vibrate?.(10);setAlbumBg(b.dataset.bg)}};
setAlbumBg(albumBg);addEventListener("resize",grooveCenter);
$("#sheet").addEventListener("scroll",e=>e.target.classList.toggle("scrolled",e.target.scrollTop>4),{passive:true});

$("#sheetBody").onclick=e=>{
  const x=e.target.closest("[data-x]");if(x){removeYT(x.dataset.x);return}
  const fv=e.target.closest("[data-fav]");if(fv){toggleFav(fv.dataset.fav,fv);return}
  const rr=e.target.closest(".rr");if(rr){playRadio(rr.dataset.r,rr);return}
  const tg=e.target.closest("[data-tag]");if(tg){R.tag=R.tag===tg.dataset.tag?"":tg.dataset.tag;
    document.querySelectorAll("[data-tag]").forEach(b=>b.classList.toggle("on",b.dataset.tag===R.tag));radioSearch();return}
  const pl=e.target.closest("[data-pl]");if(pl){pl.classList.add("busy");playPlaylist({id:pl.dataset.pl}).catch(err=>toast(err.message,6000)).finally(()=>pl.classList.remove("busy"));return}
  const hh=e.target.closest(".hr[data-h]");if(hh){playFromHistory(hh.dataset.h,hh);return}
  if(e.target.closest("#lyre")){e.preventDefault();const w=$("#lyfw");w.hidden=!w.hidden;if(!w.hidden)w.scrollIntoView({behavior:"smooth",block:"center"});return}
  const lp=e.target.closest(".ly p[data-i]");if(lp&&S.track?.id===LY.tid){ctl.seek(LY.lines[+lp.dataset.i].t);lyUserScroll=0;return}
  if(e.target.closest("#editAlbum")){editing=true;renderSheet();$("#sheet").scrollTop=0;return}
  if(e.target.closest("#e_cancel")){editing=false;renderSheet();return}
  if(e.target.closest("#e_find")){const cs=$("#cs");cs.classList.toggle("open");if(cs.classList.contains("open")&&!$("#csr").children.length)searchCovers();return}
  const cc=e.target.closest("#csr .c");if(cc){pickCover(cc);return}
  if(e.target.closest("#e_del")){$("#delbox").classList.add("open");$("#delbox").scrollIntoView({behavior:"smooth",block:"center"});return}
  if(e.target.closest("#e_delno")){$("#delbox").classList.remove("open");return}
  const dk=e.target.closest("#e_delok");if(dk){deleteAlbum(dk);return}
  const sv=e.target.closest("#e_save");if(sv){saveEdit(sv);return}
  if(editing)return;
  const b=e.target.closest("#playAll");if(b){ctl.playAlbum(openAlbum,b);return}
  const t=e.target.closest(".t");if(t){t.classList.add("busy");Promise.resolve(ctl.playTrack(t.dataset.t)).finally(()=>t.classList.remove("busy"))}
};

let volDragging=false,volTimer=null;
$("#vol").onclick=e=>{navigator.vibrate?.(10);$("#volpop").classList.toggle("open");e.currentTarget.classList.toggle("on");fitBar()};
$("#vr").oninput=e=>{volDragging=true;const v=+e.target.value;$("#vl").textContent=v+"%";
  clearTimeout(volTimer);volTimer=setTimeout(()=>ctl.volume(v).finally(()=>volDragging=false),120)};

let libVer=null;
async function load(){
  const d=await (await fetch("/api/library")).json();libVer=d.lib;
  if(d.api!==2){$("#lib").innerHTML=`<p class="empty" style="color:var(--err)">${T("O server.py no celular está desatualizado.")}<br>${T("Copie a versão nova e reinicie o servidor.")}</p>`;return}
  lib=d.albums;byId={};trackById={};playerName=d.player||"Receiver";renderOut();
  historyOn=d.history!==false;playMin=d.play_min||30;
  lib.forEach(a=>{byId[a.id]=a;a.tracks.forEach(t=>trackById[t.id]={t,a})});
  const vids=(d.yt||[]).filter(y=>!y.playlist);
  vids.forEach(y=>ytKnown[y.id]=y);Object.values(ytKnown).forEach(regYT);   // keep what is playing even if it left the history
  ytList=(d.yt||[]).map(y=>y.playlist?y:trackById[y.id].a);
  Object.values(radioKnown).forEach(regRadio);
  loadRadios();render();if(openAlbum&&!editing)renderSheet();   // don't wipe a form being edited
}
async function poll(){
  try{
    const st=await (await fetch("/api/status")).json();
    if(mode==="local"){if(st.lib!=null&&libVer!=null&&st.lib!==libVer){libVer=st.lib;load()}return}
    show(st);
  }catch(e){}
}
renderOut();
load().then(()=>mode==="local"?show(localStatus()):poll());
setInterval(poll,2500);setInterval(tick,250);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});
