<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>MusicWeb</title>
<link rel="stylesheet" href="/static/app.css"></head><body>
<div id="glow"><i></i></div>

<header>
  <input id="q" placeholder="Buscar álbum, artista ou faixa…" autocomplete="off">
  <div class="seg"><button data-v="albums" data-t>Álbuns</button><button data-v="artists" data-t>Artistas</button><button data-v="plays" data-t>Tocadas</button></div>
  <button id="rdb" title="Rádios"><svg viewBox="0 0 24 24"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8c0-1.11-.89-2-2-2H8.3l8.26-3.34L15.88 1 3.24 6.15zM7 20a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm13-8h-2v-2h-2v2H4V8h16v4z"/></svg></button>
  <button id="rs" title="Reescanear biblioteca"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
</header>
<main id="lib"></main>

<section id="sheet"><div id="sbg"><i></i></div><div class="top"><button id="back" data-t>‹ Voltar</button></div><div id="sheetBody"></div></section>

<div id="toast"></div>
<div id="bar">
  <div id="outrow"><button id="out"></button><div class="orr"><span id="nowfmt"></span><button id="lyb" title="Letra da música" data-t>Letra</button></div></div>
  <canvas id="vzc" aria-hidden="true"></canvas>
  <div id="pg"><span id="tc"></span><div id="prog"><div class="tr"><div class="fl"></div></div><i class="th"></i><span class="tip"></span></div><span id="td"></span></div>
  <div class="pl">
    <div id="now"></div>
    <div class="ctl">
      <button id="pv" title="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="pp" title="Tocar/Pausar"></button>
      <button id="nx" title="Próxima"><svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button id="vzb" title="Visualizador"><svg viewBox="0 0 24 24"><path d="M7 18h2V6H7v12zm4 4h2V2h-2v20zm-8-8h2v-4H3v4zm12 4h2V6h-2v12zm4-8v4h2v-4h-2z"/></svg></button>
      <button id="vol" title="Volume"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg></button>
      <button id="st" title="Parar"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
    </div>
  </div>
  <div id="volpop">
    <button id="vdn" title="Diminuir volume">−</button>
    <input id="vr" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
    <button id="vup" title="Aumentar volume">+</button>
    <span id="vl">100%</span>
  </div>
  <div id="err"></div>
</div>

<!-- order matters: later files use what the earlier ones define -->
<script src="/static/js/util.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/colors.js"></script>
<script src="/static/js/library.js"></script>
<script src="/static/js/radio.js"></script>
<script src="/static/js/plays.js"></script>
<script src="/static/js/retro.js"></script>
<script src="/static/js/lyrics.js"></script>
<script src="/static/js/player.js"></script>
<script src="/static/js/viz.js"></script>
<script src="/static/js/main.js"></script></body></html>
