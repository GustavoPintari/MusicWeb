# ~/.config/wireplumber/wireplumber.conf.d/51-no-suspend.conf
# Keeps the sound card awake: by default WirePlumber suspends an idle output after a few
# seconds, which causes a click (and a short silence) every time a song starts.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
