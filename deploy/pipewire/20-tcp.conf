# OPTIONAL — only to receive sound from another machine (e.g. a Steam Deck) on the server's output.
# ~/.config/pipewire/pipewire-pulse.conf.d/20-tcp.conf
#
# The PulseAudio protocol over TCP has NO authentication: listen only on an address that
# only your devices reach (the Tailscale IP, `tailscale ip -4`) and never on 0.0.0.0.
# Replace 100.x.y.z below, then: systemctl --user restart pipewire-pulse
#
# On the other machine (PipeWire/PulseAudio), once:
#   pactl load-module module-tunnel-sink server=tcp:100.x.y.z:4713 sink_name=receiver
# and choose "receiver" as the output in the sound settings.
pulse.properties = {
    server.address = [ "unix:native" "tcp:100.x.y.z:4713" ]
}
