# ~/.config/pipewire/pipewire.conf.d/10-rates.conf
# Without this PipeWire resamples everything to 48 kHz; with it the card follows the file's rate
# (44.1 kHz for CDs/most FLACs), so the music reaches the DAC untouched.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}
