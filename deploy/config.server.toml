# musicweb configuration for the container (Containerfile / deploy/musicweb.container).
# Paths are the ones inside the container; the Quadlet maps them to the server's folders.
# To change something, copy this file to /storage/apps/musicweb/config.toml and restart (see the README).

[server]
host = "0.0.0.0"              # inside the container; the Quadlet only publishes it on 127.0.0.1
port = 8095
player_name = "Receiver"      # name of the server audio output (PipeWire -> P2 jack), shown on the page

[interface]
language = "pt-BR"

[library]
music_dir = "/music"
rescan_every = 60
trash_dir = "/trash"          # removed albums: outside /music, so neither MusicWeb nor Lidarr scan them

[mpv]
audio_output = "pipewire"     # the server's PipeWire (socket mounted by the Quadlet); it owns the sound card
# Empty = PipeWire's default output, which is the P2 jack once chosen with: wpctl set-default <id>
# (ids: wpctl status). To pin one output instead, use "pipewire/<node name>" from:
#   podman exec musicweb mpv --audio-device=help
# e.g. "pipewire/alsa_output.pci-0000_00_1f.3.analog-stereo" (the onboard P2); the DAC shows up as alsa_output.usb-...
audio_device = ""
gapless = true
replaygain = "album"

[player]
resume_on_start = false
lock_minutes = 10

[history]
enabled = true
min_seconds = 30

[covers]
online = true

[lyrics]
online = true

[cache]
dir = "/cache"

[data]
dir = "/data"
